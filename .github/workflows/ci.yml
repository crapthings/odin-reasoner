name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-rdf
          ref: daa350521a8ad9f79012bb1fefa96cf00938f3f1 # v0.31.1
          path: _deps/odin-rdf
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-sparql
          ref: fcba9b6ffd542f246bf026d69dbd045624315c8d # v0.1.1
          path: _deps/odin-sparql
          persist-credentials: false
      - uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-07
      - run: odin check reasoner -no-entry-point -collection:odin-rdf=_deps/odin-rdf
      - run: odin test reasoner -collection:odin-rdf=_deps/odin-rdf
      - run: odin test reasoner/term -collection:odin-rdf=_deps/odin-rdf
      - run: odin test reasoner/store -collection:odin-rdf=_deps/odin-rdf
      - run: odin test reasoner/import -collection:odin-rdf=_deps/odin-rdf
      - run: odin test reasoner/rule -collection:odin-rdf=_deps/odin-rdf
      - run: odin test reasoner/rdfs -collection:odin-rdf=_deps/odin-rdf
      - run: odin test reasoner/owlrl -collection:odin-rdf=_deps/odin-rdf
      - run: odin test adapter/sparql -collection:odin-rdf=_deps/odin-rdf -collection:odin-sparql=_deps/odin-sparql

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-rdf
          ref: daa350521a8ad9f79012bb1fefa96cf00938f3f1 # v0.31.1
          path: _deps/odin-rdf
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: crapthings/odin-sparql
          ref: fcba9b6ffd542f246bf026d69dbd045624315c8d # v0.1.1
          path: _deps/odin-sparql
          persist-credentials: false
      - uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-07
      - run: odin check reasoner -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check reasoner/term -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check reasoner/store -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check reasoner/import -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check reasoner/rule -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check reasoner/rdfs -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check reasoner/owlrl -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf
      - run: odin check adapter/sparql -no-entry-point -vet -warnings-as-errors -collection:odin-rdf=_deps/odin-rdf -collection:odin-sparql=_deps/odin-sparql
      - run: odin test reasoner -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test reasoner/term -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test reasoner/store -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test reasoner/import -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test reasoner/rule -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test reasoner/rdfs -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test reasoner/owlrl -sanitize:address -collection:odin-rdf=_deps/odin-rdf
      - run: odin test adapter/sparql -sanitize:address -collection:odin-rdf=_deps/odin-rdf -collection:odin-sparql=_deps/odin-sparql
